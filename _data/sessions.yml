  id: 229
  title: "Thinking Low Level, Writing High Level"
  description: >
    <p>Software systems engineering is a hierarchy. There are layers of abstractions, ideally non-leaky layers. There is a gap between how a software system appears from the perspective of a high level language, and from the perspective of what the underlying platform would expect for a target of performance. An overview of contemporary hardware platforms and how software engineering and design practices and methodologies could help in building performing systems, with a particular focus on low level optimizations while maintaining higher level focus and abstractions.</p>
    <p>There is a trend of moving software engineering focus upward to constructs that have a tendency of hiding the specific of the underlying platform – and there certainly are very good reasons for such a paradigm change. Performance matters. Premature optimization is evil. Is there anything in between those two extremes? How feasible is it to rely on the abstraction of the platform as hidden by the compiler and the corresponding libraries, expecting that it will do the right thing? How much of hints and specifics would one need to expose for the compiler to be able to do the right thing? What is the right balance between expressing application logic via higher level construct yet still being able to gain the performance benefits as if relying on the low level specifics?</p>
    <p>Then there are language abstractions. Abstractions are good. They tend to hide the details that otherwise might be hard to get right, they provide for a feeling of certain constructs being simpler, and they appear to just work. Moreover, they appear to just work with no additional cost, at least on paper. Is it really the case? Let’s take a look and see. This is a look inside workings of several areas of machinery that is commodity in practical software engineering – error handling, working with data collections, and simplification of control flow. An analysis of how higher level abstractions map to lower level language constructs and at what cost, and an equivalent functionality match to “simpler” options from the perspective of performance and engineering cost, and the impact to data structures and overall application design – those would be the main areas of coverage of this part of the talk.</p>
    <p>Overall the talk has separate intertwined sections, each one focusing on logically separate set of topics, giving priority to techniques and specifics relevant to single thread performance. There is little specifics of any particular higher level language as all contemporary ones support an equivalent set of functionality, instead the content is structured to look into the output of a compiler and why particular output may impact the resulting performance, and what could be done for changing it. Given the conference on C++, most of the content and examples are specific to C++, although the content is equally applicable to C, Rust, Zig, Go, and the main message is on the technologies and mechanics, and not on just the language.</p>
    <p>It might be that the layers of abstraction need to be quite leaky.</p>
