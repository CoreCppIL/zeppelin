  id: 1
  name: "Pavel"
  surname: "Šimerda"
  bio: >
    <p>Pavel Šimerda is a systems software engineer and mentor who helps engineering teams modernize and evolve C++ codebases. His work spans Linux, networking, performance analysis, debugging, software design, and industrial systems, with a focus on reducing risk and building software that remains reliable and maintainable over time.</p>
    <p>Pavel created two Rust programming courses at the Faculty of Mathematics and Physics of Charles University in Prague. He is a member of ISO/IEC JTC 1/SC 22/WG 21, the C++ standards committee, and takes an interest in SG20, its education study group. He has spoken at open-source and systems conferences since 2011, as well as at C++ meetups. He also co-organized a joint Rust and C++ meetup with the C++ Prague community at the faculty.</p>
  thumbnailUrl: PavelSimerda.jpeg
