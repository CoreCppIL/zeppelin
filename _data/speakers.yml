  bio: >
    <p>Yossi Eliaz is a Principal Engineer working on build acceleration and developer infrastructure at Incredibuild. His background spans systems and applied ML: software/firmware roles at Twistlock, Broadcom, Marvell, and BAE Systems (container security, embedded systems, cryptography, DSP); computational genomics research at Baylor College of Medicine and Rice University (Hi-C analysis, large-scale scientific pipelines); genome-assembly and CRISPR-focused ML at NRGene; deep learning for autonomous driving at Mobileye; and ML/AI product leadership at Matia.io. He now focuses on the caching, compile-farm, and snapshot infrastructure that determines whether large C/C++/C# codebases -- and the agentic tools being built on top of them -- actually scale.</p>
