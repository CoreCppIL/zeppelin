  name: "Niro"
  surname: "Singh"
  bio: >
    <p>I am a C++ software engineer with over five years of experience building high-performance and low-latency systems across embedded, networking, and security-focused domains. My work spans modern C++, multithreading, memory management, distributed systems, real-time networking, and performance optimization on Linux and Windows. I have held roles ranging from embedded software engineer to senior developer, Scrum Master, and engineering lead.</p>
    <p>I am also a Certified Ethical Hacker with a strong interest in cybersecurity, reverse engineering, malware internals, and binary analysis. Recently, I lead an AI engineering squad developing complex distributed-programming challenges for large-scale language-model training. My interests lie at the intersection of systems programming, security, and performance engineering, with a focus on turning offensive techniques into practical lessons for building more resilient software.</p>
  thumbnailUrl: NiroSingh.jpeg
